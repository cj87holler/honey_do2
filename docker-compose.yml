services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: honey_do
      POSTGRES_PASSWORD: honey_do_local
      POSTGRES_DB: honey_do
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
